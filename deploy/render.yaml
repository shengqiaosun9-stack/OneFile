services:
  - type: web
    name: onefile-backend-demo
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ONEFILE_ENV
        value: production
      - key: ONEFILE_LOCAL_MODE
        value: "0"
      - key: ONEFILE_OPS_ENABLED
        value: "1"
      - key: ONEFILE_OPS_ADMIN_EMAILS
        sync: false
      - key: ONEFILE_AUTH_DEBUG_CODES
        value: "0"
      - key: ONEFILE_SESSION_COOKIE_SECURE
        value: "1"
      - key: ONEPITCH_AI_PROVIDER
        value: deepseek
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: ONEPITCH_STORAGE_BACKEND
        value: postgres
      - key: DATABASE_URL
        sync: false
